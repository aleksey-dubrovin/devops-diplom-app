<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Пояснительная записка — Дипломный практикум</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.6;
      color: #24292e;
      margin: 0;
      background: #f6f8fa;
    }
    .container {
      display: flex;
      max-width: 1400px;
      margin: 0 auto;
    }
    .sidebar {
      width: 300px;
      padding: 24px 16px;
      background: #fff;
      border-right: 1px solid #e1e4e8;
      height: 100vh;
      position: sticky;
      top: 0;
      overflow-y: auto;
    }
    .sidebar h2 {
      font-size: 14px;
      text-transform: uppercase;
      color: #6a737d;
      margin: 0 0 12px;
      letter-spacing: 0.5px;
    }
    .sidebar a {
      display: block;
      padding: 6px 12px;
      color: #0366d6;
      text-decoration: none;
      border-radius: 6px;
      font-size: 14px;
    }
    .sidebar a:hover {
      background: #f1f8ff;
    }
    .sidebar a.active {
      background: #0366d6;
      color: #fff;
    }
    .content {
      flex: 1;
      padding: 32px 48px;
      background: #fff;
      min-height: 100vh;
    }
    .content h1 {
      border-bottom: 2px solid #e1e4e8;
      padding-bottom: 12px;
      font-size: 28px;
      margin-top: 0;
    }
    .content h2 {
      font-size: 22px;
      border-bottom: 1px solid #e1e4e8;
      padding-bottom: 6px;
      margin-top: 32px;
    }
    .content h3 { font-size: 18px; margin-top: 24px; }
    .content code {
      background: #f6f8fa;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 85%;
    }
    .content pre {
      background: #f6f8fa;
      padding: 16px;
      border-radius: 6px;
      overflow-x: auto;
      border: 1px solid #e1e4e8;
    }
    .content pre code {
      background: none;
      padding: 0;
      font-size: 13px;
      line-height: 1.5;
    }
    .content table {
      border-collapse: collapse;
      margin: 16px 0;
      width: 100%;
      font-size: 14px;
    }
    .content th, .content td {
      border: 1px solid #dfe2e5;
      padding: 8px 12px;
      text-align: left;
    }
    .content th {
      background: #f6f8fa;
      font-weight: 600;
    }
    .content blockquote {
      border-left: 4px solid #dfe2e5;
      color: #6a737d;
      padding-left: 16px;
      margin-left: 0;
    }
    .content a {
      color: #0366d6;
      text-decoration: none;
    }
    .content a:hover { text-decoration: underline; }
    .loading {
      color: #6a737d;
      font-style: italic;
    }
    .error {
      color: #d73a49;
      background: #ffeef0;
      padding: 16px;
      border-radius: 6px;
      border: 1px solid #f5c6cb;
    }
    .home-link {
      display: inline-block;
      margin-bottom: 16px;
      font-size: 14px;
      color: #6a737d;
    }
    @media (max-width: 900px) {
      .container { flex-direction: column; }
      .sidebar {
        width: 100%;
        height: auto;
        position: relative;
        border-right: none;
        border-bottom: 1px solid #e1e4e8;
      }
      .content { padding: 24px 16px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <h2>Пояснительная записка</h2>
      <nav id="nav"></nav>
    </aside>

    <main class="content">
      <a href="/" class="home-link">← На главную</a>
      <div id="content">
        <p class="loading">Загрузка документации...</p>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>

  <script>
    const chapters = [
      { file: 'README.md',                title: 'Оглавление' },
      { file: '01-intro.md',              title: 'Введение' },
      { file: '02-infrastructure.md',     title: 'Глава 1. Инфраструктура' },
      { file: '03-kubernetes.md',         title: 'Глава 2. Kubernetes' },
      { file: '04-application.md',        title: 'Глава 3. Приложение' },
      { file: '05-monitoring.md',         title: 'Глава 4. Мониторинг' },
      { file: '06-cicd.md',               title: 'Глава 5. CI/CD' },
      { file: '07-operations.md',         title: 'Глава 6. Эксплуатация' },
      { file: '08-conclusion.md',         title: 'Заключение' },
      { file: '09-references.md',         title: 'Список литературы' },
      { file: '10-appendix.md',           title: 'Приложения' }
    ];

    // Настройка marked
    marked.setOptions({
      highlight: function(code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          try {
            return hljs.highlight(code, { language: lang }).value;
          } catch (e) {}
        }
        return hljs.highlightAuto(code).value;
      },
      breaks: false,
      gfm: true
    });

    const nav = document.getElementById('nav');
    const content = document.getElementById('content');

    // Строим навигацию
    chapters.forEach((ch, idx) => {
      const a = document.createElement('a');
      a.href = '#' + ch.file;
      a.textContent = ch.title;
      a.dataset.file = ch.file;
      a.addEventListener('click', (e) => {
        e.preventDefault();
        loadChapter(ch.file);
      });
      nav.appendChild(a);
    });

    // Загрузка главы
    async function loadChapter(file) {
      content.innerHTML = '<p class="loading">Загрузка...</p>';
      document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
      document.querySelector(`.sidebar a[data-file="${file}"]`)?.classList.add('active');
      window.location.hash = file;

      try {
        const response = await fetch('docs/' + file);
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const md = await response.text();
        content.innerHTML = marked.parse(md);
        // Подсветка кода
        content.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
      } catch (err) {
        content.innerHTML = `<div class="error">Не удалось загрузить ${file}: ${err.message}</div>`;
      }
    }

    // Стартовая глава
    const initial = window.location.hash.replace('#', '') || 'README.md';
    loadChapter(initial);
  </script>
</body>
</html>
