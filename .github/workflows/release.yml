# =============================================================================
# Release: сборка образа с тегом + триггер деплоя в k8s-репо
# =============================================================================
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag для сборки'
        required: true

env:
  IMAGE_NAME: devops-diplom-app

jobs:
  release:
    name: Build and push release image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ----------------------------------------------------------------------
      # Секрет: JSON-ключ сервисного аккаунта
      # ----------------------------------------------------------------------
      - name: Write Service Account Key
        run: |
          echo '${{ secrets.YC_SERVICE_ACCOUNT_KEY_B64 }}' | base64 -d > ${{ github.workspace }}/sa-key.json
          chmod 600 ${{ github.workspace }}/sa-key.json

      # ----------------------------------------------------------------------
      # Авторизация в Container Registry
      # ----------------------------------------------------------------------
      - name: Login to Yandex Container Registry
        run: |
          cat ${{ github.workspace }}/sa-key.json | \
            docker login cr.yandex --username json_key --password-stdin

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="${{ github.event.inputs.tag }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Версия: $VERSION"

      - name: Build and push release image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ secrets.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ secrets.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----------------------------------------------------------------------
      # Триггер деплоя в k8s-репозитории
      # ----------------------------------------------------------------------
      - name: Trigger deploy in devops-diplom-k8s
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.K8S_REPO_PAT }}
          repository: aleksey-dubrovin/devops-diplom-k8s
          event-type: release-published
          client-payload: |
            {
              "version": "${{ steps.version.outputs.version }}",
              "image": "${{ secrets.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"
            }

      - name: Show result
        run: |
          echo "Образ собран и запушен"
          echo "Registry: ${{ secrets.REGISTRY_URL }}"
          echo "Image:    ${{ env.IMAGE_NAME }}"
          echo "Version:  ${{ steps.version.outputs.version }}"
          echo "Триггер деплоя отправлен в k8s-репо"