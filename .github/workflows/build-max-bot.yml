# =============================================================================
# CI: сборка образа MAX Bot и push в Yandex Container Registry
# =============================================================================
name: Build Max Bot

on:
  pull_request:
    branches: [main]
    paths:
      - 'max-bot/**'
      - '.github/workflows/build-max-bot.yml'
  push:
    branches: [main]
    paths:
      - 'max-bot/**'
      - '.github/workflows/build-max-bot.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: max-bot

jobs:
  build:
    name: ${{ github.event_name == 'pull_request' && 'Build (check only)' || 'Build and push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (PR check)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./max-bot
          push: false
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE_NAME }}:pr-check
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write Service Account Key
        if: github.event_name != 'pull_request'
        run: |
          echo '${{ secrets.YC_SERVICE_ACCOUNT_KEY_B64 }}' | base64 -d > ${{ github.workspace }}/sa-key.json
          chmod 600 ${{ github.workspace }}/sa-key.json

      - name: Login to Yandex Container Registry
        if: github.event_name != 'pull_request'
        run: |
          cat ${{ github.workspace }}/sa-key.json | \
            docker login cr.yandex --username json_key --password-stdin

      - name: Build and push (main)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./max-bot
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ secrets.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show result
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "PR check: образ собран без пуша"
          else
            echo "Образ max-bot собран и запушен"
            echo "Registry: ${{ secrets.REGISTRY_URL }}"
            echo "Image:    ${{ env.IMAGE_NAME }}"
          fi