# =============================================================================
# CI: сборка Docker-образа и push в Yandex Container Registry
# =============================================================================
name: Build and Push

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/workflows/release.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: devops-diplom-app

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Yandex Container Registry
        uses: docker/login-action@v3
        with:
          registry: cr.yandex
          username: json_key
          password: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_B64 }}

      - name: Extract short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ secrets.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:sha-${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show result
        run: |
          echo "=== Образ собран и запушен ==="
          echo "Registry: ${{ secrets.REGISTRY_URL }}"
          echo "Image:    ${{ env.IMAGE_NAME }}"
          echo "Tags:     latest, sha-${{ steps.vars.outputs.sha_short }}"