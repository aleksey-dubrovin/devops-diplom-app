# =============================================================================
# CI: сборка Docker-образа
# =============================================================================
name: Build and Push

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/workflows/release.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: devops-diplom-app

jobs:
  build:
    name: ${{ github.event_name == 'pull_request' && 'Build (check only)' || 'Build and push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ----------------------------------------------------------------------
      # Для PR: только сборка без авторизации и пуша
      # ----------------------------------------------------------------------
      - name: Build (PR check)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: false
          tags: ${{ env.IMAGE_NAME }}:pr-check
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----------------------------------------------------------------------
      # Для push в main: авторизация и полная сборка с пушем
      # ----------------------------------------------------------------------
      - name: Write Service Account Key
        if: github.event_name != 'pull_request'
        run: |
          echo '${{ secrets.YC_SERVICE_ACCOUNT_KEY_B64 }}' | base64 -d > ${{ github.workspace }}/sa-key.json
          chmod 600 ${{ github.workspace }}/sa-key.json

      - name: Login to Yandex Container Registry
        if: github.event_name != 'pull_request'
        run: |
          cat ${{ github.workspace }}/sa-key.json | \
            docker login cr.yandex --username json_key --password-stdin

      - name: Extract short SHA
        if: github.event_name != 'pull_request'
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push (main)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ secrets.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:sha-${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show result
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "PR check: образ собран без пуша в registry"
          else
            echo "Образ собран и запушен"
            echo "Registry: ${{ secrets.REGISTRY_URL }}"
            echo "Image:    ${{ env.IMAGE_NAME }}"
            echo "Tags:     latest, sha-${{ steps.vars.outputs.sha_short }}"
          fi